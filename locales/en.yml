en:
  hero:
    title: "Help keep our community running"
    highlights_label: "Why support"
  sidebar:
    title: "Support us"
  btcpay:
    amount_label: "Donation amount"
    amount_placeholder: "Amount"
    creating: "Creating invoice…"
    login_to_donate: "Log in to donate"
  copied_value: "Value copied"
  no_copied_value: "Copying failed"
  support_bar:
    aria_label: "Community support"
    progress_label: "Support goal progress"
    default_label: "Community support goal"
    of_goal: "of"
    goal_reached: "Goal reached"
    goal_exceeded: "Goal exceeded"
    period_one_time: "One-time"
    period_monthly: "Monthly"
    period_yearly: "Yearly"
  main_heading_content:
    title: "Support the community"
    description: "Community-funded projects rely on people who find them useful. Every contribution helps with hosting, development, and ongoing maintenance."
  supporters:
    label: "Our supporters"
    title: "Our supporters"
    more_title: "More supporters"
    more_label:
      one: "+%{count} more supporter"
      other: "+%{count} more supporters"
  theme_metadata:
    settings:
      show_for_members: "Display the donation trigger for logged-in users"
      show_for_anon: "Display the donation trigger for anonymous users"
      display_on_homepage: "Display the donation trigger on the configured homepage"
      url_must_contain: "Display the donation trigger on matching paths. Add <code>*</code> to the end for a wildcard"
      trust_level: "Minimum trust level required to display the donation trigger"
      modal_size: "Width of the support modal"
      excluded_groups: "Groups that should not see the automatic support trigger, outlet widgets or generic embeds; contextual [wrap=donate] blocks and the manual #donate link remain available"
      support_icon: "Icon shown in the support box and the sidebar block. Phosphor names such as <code>ph-dt-hand-heart</code> need the Phosphor Duotone icons component installed; use <code>heart</code> for a core icon."
      design: "Visual design used by the support UI"
      default_post_view: "Default layout used by embedded support blocks"
      enable_post_embed: "Enable [wrap=donate], [wrap=donate-compact], [wrap=donate-minimal] and [wrap=donate-progress] in posts"
      support_bar_enabled: "Enable the support progress bar"
      support_bar_layout: "Support bar layout"
      support_bar_in_modal: "Show the support bar in the modal"
      support_bar_in_posts: "Show the support bar in post embeds"
      support_bar_in_outlets: "Show the support bar in plugin outlet widgets"
      support_bar_in_embeds: "Show the support bar in generic HTML embeds"
      support_goal: "Support goal amount. Set to 0 to hide the progress bar"
      support_current: "Current supported amount. Used only as a fallback: when the BTCPay subscriptions plugin is installed, the live donation total replaces it"
      support_currency: "Currency code displayed next to support amounts, for example EUR or USD"
      support_label: "Optional custom label for the support goal"
      support_period: "Goal period"
      outlet_enabled: "Enable rendering the support widget directly in Discourse plugin outlets"
      outlet_locations: "Plugin outlet names, separated with |. Examples: above-main-container, before-topic-list, after-topic-list, topic-list-bottom, below-site-header"
      outlet_view: "Layout used for plugin outlet widgets"
      outlet_design: "Design used for plugin outlet widgets"
      embed_widget_enabled: "Render the generic <code>data-donation-widget=\"support\"</code> embed"
      supporter_avatars_enabled: "Show supporter avatars in the support bar (supporters are configured below)"
      supporter_avatar_count: "Number of supporter avatars shown directly in the support bar"
      show_supporter_amounts: "Show supporter contribution amounts in the supporter list"
      supporters:
        description: "Add supporters manually. The username resolves to the public Discourse profile and avatar automatically."
        schema:
          properties:
            username:
              label: "Username"
              description: "Discourse username of the supporter"
            amount:
              label: "Amount"
              description: "Optional contribution amount"
            currency:
              label: "Currency"
              description: "Optional currency code, for example EUR or USD"
      supporter_groups: "Automatically pull in supporters from one or more groups, ordered by group-join date, newest first. Complements — doesn't replace — the manual list above."
      donation_methods:
        description: "Add, edit, reorder and configure the available support methods"
        schema:
          properties:
            featured:
              label: "Featured"
              description: "Put this method's amount field and button inside the support box. Only one method should be featured."
            name:
              label: "Name"
              description: "Support method name"
            description:
              label: "Description"
              description: "Short description"
            button_text:
              label: "Button text"
              description: "Support button label"
            use_btcpay:
              label: "BTCPay donation"
              description: "Take the donation on-site through the BTCPay subscriptions plugin instead of linking out. Shows an amount field and a donate button; the URL is ignored."
            use_stripe:
              label: "Stripe donation"
              description: "Treat the URL as a Stripe Payment Link set to let customers choose what to pay. Shows an amount field and prefills it on Stripe's page; cards and any wallets enabled on the link are offered there. Ignored when BTCPay donation is on."
            url:
              label: "URL"
              description: "Full support URL"
            icon:
              label: "Logo"
              description: "Optional provider logo"
            owner:
              label: "Owner"
              description: "Optional recipient or beneficiary"
            provider:
              label: "Provider"
              description: "Optional payment provider or institution"
            copy_label:
              label: "Copy value label"
              description: "For example account number, handle, or identifier"
            copy_value:
              label: "Copy value"
              description: "Value users can copy with one click"
            translations:
              description: "Optional translated content for each supported locale"
              schema:
                properties:
                  locale:
                    label: "Locale"
                  name:
                    label: "Name"
                  description:
                    label: "Description"
                  button_text:
                    label: "Button text"
                  copy_label:
                    label: "Copy label"
                  owner:
                    label: "Owner"
                  provider:
                    label: "Provider"
      support_highlights:
        description: "Highlights shown in the support modal hero. Add one or more items and optionally translate each item."
        schema:
          properties:
            text:
              label: "Text"
              description: "Highlight text"
            icon:
              label: "Icon"
              description: "Discourse icon name"
            translations:
              description: "Optional translated text for each supported locale"
              schema:
                properties:
                  locale:
                    label: "Locale"
                  text:
                    label: "Text"
